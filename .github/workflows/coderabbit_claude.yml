name: CodeRabbit Review (Anthropic)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeRabbit Review
        uses: coderabbitai/openai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Aquí pones tu clave de OpenRouter
          OPENAI_API_KEY: ${{ secrets.OPEN_ROUTER_KEY }} 
        with:
          debug: false
          # Usamos los nombres de modelos de Anthropic vía OpenRouter
          openai_light_model: anthropic/claude-3-haiku
          openai_heavy_model: anthropic/claude-3.5-sonnet
          # Es VITAL cambiar la URL base para que no apunte a OpenAI
          openai_base_url: https://openrouter.ai/api/v1
          language: es-ES