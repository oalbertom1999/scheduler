name: CodeRabbit Review (Anthropic)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeRabbit Review (Anthropic)
        uses: coderabbitai/anthropic-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_KEY }}
        with:
          debug: false
          anthropic_model: claude-3-5-sonnet-20240620
          language: es-ES