name: CodeRabbit Free (Groq)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeRabbit Review with Groq
        uses: coderabbitai/openai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          debug: false
          # Configuramos el Endpoint de Groq y sus modelos
          api_base_url: https://api.groq.com/openai/v1
          openai_light_model: llama3-8b-8192
          openai_heavy_model: llama3-70b-8192
          # Opcional: Idioma de la respuesta
          language: es-ES